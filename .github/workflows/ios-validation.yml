name: iOS validation
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_build:
        description: Build native dependencies and unsigned iOS app
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Current Bot and device repair contracts
        if: ${{ !cancelled() }}
        run: |
          python3 src/ios/MinisTests/Standalone/run_agent_prompt_tests.py --require-swift
          python3 src/ios/MinisTests/Standalone/check_current_bot_contract.py
          python3 src/ios/MinisTests/Standalone/check_chat_settings_contracts.py
          python3 src/ios/MinisTests/Standalone/check_auxiliary_usage_sql.py
          python3 src/ios/MinisTests/Standalone/run_secure_input_tests.py
          python3 src/ios/MinisTests/Standalone/run_credential_save_tests.py
          python3 src/ios/MinisTests/Standalone/run_browser_takeover_tests.py
      - name: High risk recovery behavior (native Swift required)
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_review_recovery_tests.py --require-swift
      - name: Fresh product initialization and Swift syntax
        if: ${{ !cancelled() }}
        run: |
          python3 src/ios/MinisTests/Standalone/check_fresh_install.py
          python3 src/ios/MinisTests/Standalone/parse_ios_sources.py
      - name: Parse changed Swift sources
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            src/ios/Agent/BrowserUse/BrowserBookmarks.swift \
            src/ios/Agent/BrowserUse/BrowserPasswords.swift \
            src/ios/Agent/BrowserUse/BrowserSheetView.swift \
            src/ios/Agent/Jobs/AgentJobRegistry.swift \
            src/ios/Views/Chat/ScheduledTaskDetailView.swift \
            src/ios/Views/Settings/SettingsSheet.swift \
            src/ios/Views/MCP/MCPIntegrationsView.swift \
            src/ios/Views/Settings/OffloadPermissionSettingsView.swift \
            src/ios/Agent/Offload/OffloadPermissionManager.swift \
            src/ios/Agent/Chat/AIChatViewModel+SystemPrompt.swift \
            src/ios/Views/ContentView/Bots/BotWorkspaceStore.swift \
            src/ios/Views/ContentView/Bots/BotWorkspaceStore+Sessions.swift \
            src/ios/Views/ContentView/Bots/BotRoomRunner.swift \
            src/ios/Views/ContentView/Bots/BotWorkspaceView.swift \
            src/ios/Views/ContentView/Bots/BotMemoryStore.swift \
            src/ios/Views/ContentView/Bots/BotMemoryView.swift \
            src/ios/Views/ContentView/Bots/AIChatViewModel+BotMemory.swift \
            src/ios/Agent/Chat/AIChatViewModel+MemoryTools.swift \
            src/ios/Agent/Chat/AIChatViewModel+AgentLoop.swift \
            src/ios/Agent/Chat/AIChatViewModel+ToolDefinitions.swift \
            src/ios/Views/Chat/SessionMemoryView.swift \
            src/ios/Views/Chat/MemoryWriteRevoker.swift \
            src/ios/Views/ContentView/ContentView.swift \
            src/ios/Views/ContentView/ContentView+SessionList.swift \
            src/ios/MinisTests/BrowserBookmarkStoreTests.swift \
            src/ios/MinisTests/BrowserCredentialOriginTests.swift; do
            xcrun swiftc -frontend -parse "$file"
          done
      - name: Existing scheduled task regression tests
        if: ${{ !cancelled() }}
        run: |
          swift src/ios/MinisTests/Standalone/ScheduledRunNowTests.swift
          swift src/ios/MinisTests/Standalone/ScheduledTaskDetailTests.swift
      - name: Chat top viewport and banner regression guards
        if: ${{ !cancelled() }}
        run: |
          swift src/ios/MinisTests/Standalone/TopBannersTests.swift
          swift src/ios/MinisTests/Standalone/ScheduledBannerTests.swift
      - name: Bot workspace persistence tests
        if: ${{ !cancelled() }}
        run: |
          swiftc src/ios/Views/ContentView/Bots/BotWorkspaceStore.swift src/ios/MinisTests/Standalone/BotWorkspacePersistenceTests.swift -o "$RUNNER_TEMP/bot-tests"
          "$RUNNER_TEMP/bot-tests"
      - name: Backup manifest preview behavior
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_backup_preview_tests.py
      - name: Split workspace history migration and failure recovery
        if: ${{ !cancelled() }}
        run: |
          swiftc -swift-version 6 src/ios/Views/ContentView/Bots/BotWorkspaceStore.swift src/ios/MinisTests/Standalone/BotWorkspaceSplitHistoryTests.swift -o "$RUNNER_TEMP/bot-history-tests"
          "$RUNNER_TEMP/bot-history-tests"
      - name: Bot memory entries
        if: ${{ !cancelled() }}
        run: |
          swiftc src/ios/Views/ContentView/Bots/BotMemoryStore.swift src/ios/MinisTests/Standalone/BotMemoryEntryTests.swift -lsqlite3 -o "$RUNNER_TEMP/bot-memory-tests"
          "$RUNNER_TEMP/bot-memory-tests"
      - name: Combined memory document transactions
        if: ${{ !cancelled() }}
        run: |
          swiftc src/ios/Views/ContentView/Bots/BotMemoryStore.swift src/ios/MinisTests/Standalone/BotMemoryDocumentTests.swift -lsqlite3 -o "$RUNNER_TEMP/bot-memory-document-tests"
          "$RUNNER_TEMP/bot-memory-document-tests"
      - name: Auxiliary inference billing persistence
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_auxiliary_usage_tests.py
      - name: Bot delivery persistence and logical message count
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_bot_delivery_tests.py
      - name: Bot memory runtime boundaries
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_bot_memory_runtime_tests.py
      - name: Current model identity
        if: ${{ !cancelled() }}
        run: |
          swiftc src/ios/Providers/ModelEntry.swift src/ios/MinisTests/Standalone/ModelEntryIdentityTests.swift -o "$RUNNER_TEMP/model-identity-tests"
          "$RUNNER_TEMP/model-identity-tests"
      - name: Bot memory iOS UI type checking
        if: ${{ !cancelled() }}
        run: |
          python3 src/ios/MinisTests/Standalone/check_bot_memory_editor_layout.py
          python3 src/ios/MinisTests/Standalone/check_bot_memory_ui.py
      - name: Browser storage behavior tests
        if: ${{ !cancelled() }}
        run: |
          python3 src/ios/MinisTests/Standalone/run_browser_storage_tests.py
          python3 src/ios/MinisTests/Standalone/run_mount_resolution_tests.py
      - name: Schedule editing behavior tests
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_schedule_edit_tests.py
      - name: Completion wait lifecycle regression tests
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_schedule_completion_tests.py
      - name: Backup model restore regression tests
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_backup_model_restore_tests.py
      - name: Local backup storage regression tests
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_local_backup_storage_tests.py --require-swift
      - name: Bot capability transport regression tests
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_capability_transport_tests.py
      - name: Backup format and inbound cursor regressions
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_review_followup_tests.py
      - name: Bot workspace backup and device restore
        if: ${{ !cancelled() }}
        run: |
          swiftc src/ios/Views/ContentView/Bots/BotWorkspaceStore.swift \
            src/ios/Views/ContentView/Bots/BotMemoryStore.swift \
            src/ios/Views/ContentView/Bots/BotWorkspaceArchive.swift \
            src/ios/MinisTests/Standalone/BotWorkspaceArchiveTests.swift \
            -lsqlite3 -o "$RUNNER_TEMP/bot-archive-tests"
          "$RUNNER_TEMP/bot-archive-tests"
      - name: Restored Bot model requirement and cache behavior
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_bot_model_restore_routing_tests.py
      - name: Frozen Bot graph and SQLite rollback behavior
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_bot_frozen_snapshot_tests.py
      - name: Shipping Bot command state transitions
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_bot_tool_command_tests.py
      - name: Direct target Bot handoff lifecycle
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_bot_direct_execution_tests.py
      - name: Bot chat timeline ordering and live task presentation
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_bot_chat_presentation_tests.py
      - name: Commander, task restore and quoted message contracts
        if: ${{ !cancelled() }}
        run: |
          swiftc src/ios/Views/ContentView/Bots/BotWorkspaceStore.swift \
            src/ios/Views/ContentView/Bots/BotMemoryStore.swift \
            src/ios/Views/ContentView/Bots/BotWorkspaceArchive.swift \
            src/ios/Agent/Chat/ChatMessagePresentation.swift \
            src/ios/MinisTests/Standalone/BotTeamContractTests.swift \
            -lsqlite3 -o "$RUNNER_TEMP/bot-team-tests"
          "$RUNNER_TEMP/bot-team-tests"
          python3 src/ios/MinisTests/Standalone/check_bot_avatar_assets.py
      - name: Bot room orchestration behavior tests
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_bot_room_tests.py
      - name: Browser form WebKit tests
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_browser_form_tests.py
      - name: Capability permission behavior tests
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_capability_permission_tests.py
      - name: Bot workspace search behavior tests
        if: ${{ !cancelled() }}
        run: |
          swiftc src/ios/Views/ContentView/Bots/BotWorkspaceStore.swift \
            src/ios/MinisTests/Standalone/BotWorkspaceSearchTests.swift -o "$RUNNER_TEMP/bot-search-tests"
          "$RUNNER_TEMP/bot-search-tests"
      - name: Bot workspace search scale baseline
        if: ${{ !cancelled() }}
        run: |
          swiftc -O src/ios/Views/ContentView/Bots/BotWorkspaceStore.swift src/ios/MinisTests/Standalone/BotWorkspaceSearchBenchmark.swift -o "$RUNNER_TEMP/bot-search-benchmark"
          "$RUNNER_TEMP/bot-search-benchmark" | tee "$RUNNER_TEMP/bot-search-benchmark.txt"
          python3 src/ios/MinisTests/Standalone/benchmark_search_sql.py | tee -a "$RUNNER_TEMP/bot-search-benchmark.txt"
      - name: Upload search scale baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-search-scale-baseline
          path: ${{ runner.temp }}/bot-search-benchmark.txt
          if-no-files-found: warn
      - name: Bot session binding behavior tests
        if: ${{ !cancelled() }}
        run: |
          swiftc src/ios/Views/ContentView/Bots/BotWorkspaceStore.swift \
            src/ios/Views/ContentView/Bots/BotWorkspaceStore+Sessions.swift \
            src/ios/MinisTests/Standalone/BotSessionBindingTests.swift -o "$RUNNER_TEMP/bot-session-tests"
          "$RUNNER_TEMP/bot-session-tests" "$RUNNER_TEMP/bot-session-workspace.json"
  ui-layout:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Native settings row layout checks
        run: python3 src/ios/MinisTests/Standalone/run_settings_layout_tests.py
      - name: Original avatar decoding, animation and picker fixtures
        run: python3 src/ios/MinisTests/Standalone/run_bot_avatar_native_tests.py
      - name: Upload original avatar evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-bot-avatar-evidence
          path: build/validation/bot-avatar-ui
          if-no-files-found: ignore
          retention-days: 7
      - name: Secure presentation native fixtures
        run: python3 src/ios/MinisTests/Standalone/run_native_interaction_tests.py
      - name: Upload native interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-interaction-evidence
          path: build/validation/native-interactions
          if-no-files-found: ignore
          retention-days: 7
      - name: Native history send and snapshot serialization
        if: ${{ !cancelled() }}
        run: python3 src/ios/MinisTests/Standalone/run_chat_send_native_tests.py
      - name: Kernel blocking hang stack regression
        if: ${{ !cancelled() }}
        run: swift src/ios/MinisTests/Standalone/HangKernelLeafTests.swift
      - name: Upload chat send evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-chat-send-evidence
          path: build/validation/chat-send-native
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload native layout snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-layout-snapshots
          path: build/validation/ui-layout
          if-no-files-found: ignore
          retention-days: 7
  device-build:
    if: github.event_name == 'workflow_dispatch' && inputs.full_build
    runs-on: macos-26-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          brew install ninja llvm lld libarchive pkg-config meson
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v5
        with:
          go-version-file: deps/rclone-mobile/go.mod
          cache-dependency-path: deps/rclone-mobile/go.sum
      - name: Native dependencies
        env:
          GOTOOLCHAIN: local
        run: |
          bash deps/build_lame.sh
          bash deps/build_ffmpeg.sh
          bash deps/build_ish.sh
          bash deps/prepare_alpine_rootfs.sh
          bash deps/build_rclone_ios.sh
      - name: Unsigned iOS build
        shell: bash
        run: |
          set -euo pipefail
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-ios.log
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/DerivedData/Build/Products/Debug-iphoneos/Minis.app"
          test -d "$app_path"
          mkdir -p build/package/Payload
          ditto "$app_path" build/package/Payload/Minis.app
          cd build/package
          zip -qry ../OpenMinis-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-unsigned-ipa
          path: build/OpenMinis-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-diagnostics
          path: build-ios.log
          if-no-files-found: ignore
