name: iOS validation
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_build:
        description: Build native dependencies and unsigned iOS app
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Fresh product initialization and Swift syntax
        run: |
          python3 src/ios/MinisTests/Standalone/check_fresh_install.py
          python3 src/ios/MinisTests/Standalone/parse_ios_sources.py
      - name: Parse changed Swift sources
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            src/ios/Agent/BrowserUse/BrowserBookmarks.swift \
            src/ios/Agent/BrowserUse/BrowserPasswords.swift \
            src/ios/Agent/BrowserUse/BrowserSheetView.swift \
            src/ios/Agent/Jobs/AgentJobRegistry.swift \
            src/ios/Views/Chat/ScheduledTaskDetailView.swift \
            src/ios/Views/Settings/SettingsSheet.swift \
            src/ios/Views/MCP/MCPIntegrationsView.swift \
            src/ios/Views/Settings/OffloadPermissionSettingsView.swift \
            src/ios/Agent/Offload/OffloadPermissionManager.swift \
            src/ios/Agent/Chat/AIChatViewModel+SystemPrompt.swift \
            src/ios/Views/ContentView/Bots/BotWorkspaceStore.swift \
            src/ios/Views/ContentView/Bots/BotWorkspaceStore+Sessions.swift \
            src/ios/Views/ContentView/Bots/BotRoomRunner.swift \
            src/ios/Views/ContentView/Bots/BotWorkspaceView.swift \
            src/ios/Views/ContentView/Bots/BotMemoryStore.swift \
            src/ios/Views/ContentView/Bots/BotMemoryView.swift \
            src/ios/Views/ContentView/Bots/AIChatViewModel+BotMemory.swift \
            src/ios/Agent/Chat/AIChatViewModel+MemoryTools.swift \
            src/ios/Agent/Chat/AIChatViewModel+AgentLoop.swift \
            src/ios/Agent/Chat/AIChatViewModel+ToolDefinitions.swift \
            src/ios/Views/Chat/SessionMemoryView.swift \
            src/ios/Views/Chat/MemoryWriteRevoker.swift \
            src/ios/Views/ContentView/ContentView.swift \
            src/ios/Views/ContentView/ContentView+SessionList.swift \
            src/ios/MinisTests/BrowserBookmarkStoreTests.swift \
            src/ios/MinisTests/BrowserCredentialOriginTests.swift; do
            xcrun swiftc -frontend -parse "$file"
          done
      - name: Existing scheduled task regression tests
        run: |
          swift src/ios/MinisTests/Standalone/ScheduledRunNowTests.swift
          swift src/ios/MinisTests/Standalone/ScheduledTaskDetailTests.swift
      - name: Bot workspace persistence tests
        run: |
          swiftc src/ios/Views/ContentView/Bots/BotWorkspaceStore.swift src/ios/MinisTests/Standalone/BotWorkspacePersistenceTests.swift -o "$RUNNER_TEMP/bot-tests"
          "$RUNNER_TEMP/bot-tests"
      - name: Bot memory entries
        run: |
          swiftc src/ios/Views/ContentView/Bots/BotMemoryStore.swift src/ios/MinisTests/Standalone/BotMemoryEntryTests.swift -lsqlite3 -o "$RUNNER_TEMP/bot-memory-tests"
          "$RUNNER_TEMP/bot-memory-tests"
      - name: Bot memory runtime boundaries
        run: python3 src/ios/MinisTests/Standalone/run_bot_memory_runtime_tests.py
      - name: Current model identity
        run: |
          swiftc src/ios/Providers/ModelEntry.swift src/ios/MinisTests/Standalone/ModelEntryIdentityTests.swift -o "$RUNNER_TEMP/model-identity-tests"
          "$RUNNER_TEMP/model-identity-tests"
      - name: Bot memory iOS UI type checking
        run: python3 src/ios/MinisTests/Standalone/check_bot_memory_ui.py
      - name: Browser storage behavior tests
        run: python3 src/ios/MinisTests/Standalone/run_browser_storage_tests.py
      - name: Schedule editing behavior tests
        run: python3 src/ios/MinisTests/Standalone/run_schedule_edit_tests.py
      - name: Completion wait lifecycle regression tests
        run: python3 src/ios/MinisTests/Standalone/run_schedule_completion_tests.py
      - name: Backup model restore regression tests
        run: python3 src/ios/MinisTests/Standalone/run_backup_model_restore_tests.py
      - name: Bot room orchestration behavior tests
        run: python3 src/ios/MinisTests/Standalone/run_bot_room_tests.py
      - name: Browser form WebKit tests
        run: python3 src/ios/MinisTests/Standalone/run_browser_form_tests.py
      - name: Capability permission behavior tests
        run: python3 src/ios/MinisTests/Standalone/run_capability_permission_tests.py
      - name: Bot session binding behavior tests
        run: |
          swiftc src/ios/Views/ContentView/Bots/BotWorkspaceStore.swift \
            src/ios/Views/ContentView/Bots/BotWorkspaceStore+Sessions.swift \
            src/ios/MinisTests/Standalone/BotSessionBindingTests.swift -o "$RUNNER_TEMP/bot-session-tests"
          "$RUNNER_TEMP/bot-session-tests" "$RUNNER_TEMP/bot-session-workspace.json"
  device-build:
    if: github.event_name == 'workflow_dispatch' && inputs.full_build
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          brew install ninja llvm lld libarchive pkg-config meson
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v5
        with:
          go-version-file: deps/rclone-mobile/go.mod
          cache-dependency-path: deps/rclone-mobile/go.sum
      - name: Native dependencies
        env:
          GOTOOLCHAIN: local
        run: |
          bash deps/build_lame.sh
          bash deps/build_ffmpeg.sh
          bash deps/build_ish.sh
          bash deps/prepare_alpine_rootfs.sh
          bash deps/build_rclone_ios.sh
      - name: Unsigned iOS build
        shell: bash
        run: |
          set -euo pipefail
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-ios.log
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/DerivedData/Build/Products/Debug-iphoneos/Minis.app"
          test -d "$app_path"
          mkdir -p build/package/Payload
          ditto "$app_path" build/package/Payload/Minis.app
          cd build/package
          zip -qry ../OpenMinis-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-unsigned-ipa
          path: build/OpenMinis-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-diagnostics
          path: build-ios.log
          if-no-files-found: ignore
